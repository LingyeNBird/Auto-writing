<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto Writing Console - New Project</title>
  <style>
    :root {
      --bg: #0c1218;
      --panel: #141d27;
      --panel-border: #26374a;
      --text: #d8e2ef;
      --muted: #8ea0b4;
      --accent: #6dd0ff;
      --danger: #ff9d8f;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 20% 10%, #182433 0%, var(--bg) 48%);
      color: var(--text);
      font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
      min-height: 100vh;
      padding: 6vh var(--space-4);
    }

    .shell {
      max-width: 760px;
      margin: 0 auto;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      background: color-mix(in oklab, var(--panel), black 8%);
      padding: calc(var(--space-4) + var(--space-2));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 var(--space-2);
      font-size: 1.35rem;
      color: var(--accent);
      letter-spacing: 0.01em;
    }

    .muted { color: var(--muted); margin: 0 0 var(--space-4); }
    .error {
      margin: 0 0 var(--space-4);
      padding: var(--space-3);
      border-left: 3px solid var(--danger);
      color: var(--danger);
      background: rgba(255, 157, 143, 0.08);
    }

    form {
      display: grid;
      gap: var(--space-4);
    }

    label {
      display: grid;
      gap: var(--space-2);
      font-size: 0.95rem;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 0.6rem 0.7rem;
      background: #0f1720;
      color: var(--text);
      font: inherit;
    }

    textarea {
      min-height: 7rem;
      resize: vertical;
    }

    button {
      width: fit-content;
      border: 1px solid color-mix(in oklab, var(--accent), black 20%);
      border-radius: 6px;
      padding: 0.55rem 0.9rem;
      background: color-mix(in oklab, var(--accent), black 65%);
      color: #eaf6ff;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="shell">
    <h1>Auto Writing Console / New Project</h1>
    {% if error %}
    <p class="error">[%= error =%]</p>
    {% else %}
    <p class="muted">Create a project to open the console.</p>
    {% endif %}
    <form method="post" action="/projects/new">
      <label>
        Project name
        <input type="text" name="name" value="[%= name =%]" required>
      </label>
      <label>
        Chapter count
        <input type="number" min="1" name="chapter_count" value="[%= chapter_count =%]" required>
      </label>
      <label>
        Theme notes
        <textarea name="theme_notes">[%= theme_notes =%]</textarea>
      </label>
      <button type="submit">Create project</button>
    </form>
  </main>
</body>
</html>
