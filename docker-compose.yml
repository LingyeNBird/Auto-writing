services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: auto-writing:local
    command:
      - python
      - -m
      - uvicorn
      - auto_writing.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./storage:/app/storage

  worker:
    image: auto-writing:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -c
      - |
        import time
        from auto_writing.worker import run_worker

        while True:
            run_worker()
            time.sleep(5)
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./storage:/app/storage
